name: ospf-triangle

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.6.2
  nodes:
    r1:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r1/frr.conf:/etc/frr/frr.conf
    r2:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r2/frr.conf:/etc/frr/frr.conf
    r3:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r3/frr.conf:/etc/frr/frr.conf
    h1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.1.1
        - ip route add 10.0.0.0/8 via 192.168.1.1
    h2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.3.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.3.1
        - ip route add 10.0.0.0/8 via 192.168.3.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r1:eth2"]
    - endpoints: ["r1:eth3", "h1:eth1"]
    - endpoints: ["r3:eth3", "h2:eth1"]
